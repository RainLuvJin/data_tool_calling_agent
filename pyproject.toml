[project]
name = "data-tool-calling-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "RainLuvJin", email = "k8688324@163.com" }
]
requires-python = ">=3.14"
dependencies = [
    "datasets>=5.1.0",
    "fastapi>=0.146.0",
    "openai>=3.31.0",
    "pandas>=3.0.6",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
data-tool-calling-agent = "data_tool_calling_agent:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["src"]
# 显示简洁的测试结果，并报告跳过或失败的测试。
addopts = "-ra"
